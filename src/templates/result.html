<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Magic AI | Analysis Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .prose h1, .prose h2 { color: #db2777; font-weight: 800; border-bottom: 2px solid #fce7f3; padding-bottom: 0.5rem; margin-top: 2rem; }
        .prose p { color: #4b5563; line-height: 1.8; }
        .prose strong { color: #be185d; }
        /* PDF 导出时的打印优化 */
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body class="bg-pink-50 min-h-screen p-4 md:p-10">
    <div id="report-container" class="max-w-4xl mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-white">
        <div class="bg-gradient-to-r from-pink-500 to-rose-500 p-8 text-white flex justify-between items-center">
            <div>
                <h2 class="text-3xl font-extrabold tracking-tight">Analysis: {{ run_id | upper }}</h2>
                <p class="opacity-90 font-medium text-sm">Biomechanics Reasoning Engine Results</p>
            </div>
            <div class="flex space-x-3 no-print">
                <button onclick="downloadPDF()" class="bg-white text-pink-600 hover:bg-pink-50 px-6 py-3 rounded-2xl font-bold transition-all shadow-lg flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1h16v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Download PDF
                </button>
                <a href="/" class="bg-white/20 hover:bg-white/40 backdrop-blur-md px-6 py-3 rounded-2xl font-bold transition-all border border-white/30 text-white">
                    New Analysis
                </a>
            </div>
        </div>
        
        <div id="reportContent" class="p-10 md:p-16 prose prose-pink max-w-none text-gray-700">
            <div class="flex justify-center py-10">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-500"></div>
            </div>
        </div>
    </div>

    <script>
        const markdown = {{ report | tojson }};
        document.getElementById('reportContent').innerHTML = marked.parse(markdown);

        function downloadPDF() {
            const element = document.getElementById('report-container');
            const runId = "{{ run_id }}";
            
            const opt = {
                margin:       [10, 10],
                filename:     `Magic_Analysis_${runId}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic AI | Sprint Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .pink-gradient { background: linear-gradient(135deg, #fce7f3 0%, #ffe4e6 100%); }
    </style>
</head>
<body class="pink-gradient min-h-screen flex items-center justify-center p-6">
    <div class="glass max-w-md w-full rounded-3xl shadow-2xl p-8 border border-white/50 transform transition-all">
        <div class="text-center mb-10">
            <div class="inline-block p-4 bg-pink-200 rounded-3xl shadow-inner mb-4">
                <svg class="w-10 h-10 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">Magic AI</h1>
            <p class="text-pink-500 font-medium mt-2">Professional Biomechanics Intelligence</p>
        </div>

        <form method="post" id="analysisForm" class="space-y-8">
            <div class="space-y-3">
                <label class="block text-sm font-semibold text-gray-600 ml-1">Select Performance Session</label>
                <div class="relative">
                    <select name="run_id" class="w-full p-4 bg-white/50 border-2 border-pink-100 rounded-2xl focus:ring-4 focus:ring-pink-200 focus:border-pink-400 outline-none appearance-none transition-all cursor-pointer text-gray-700 font-medium">
                        {% for run in runs %}
                        <option value="{{ run }}">{{ run | upper | replace('_', ' ') }}</option>
                        {% endfor %}
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-pink-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-5 rounded-2xl shadow-xl shadow-pink-200 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center space-x-2">
                <span>Run AI Diagnostics</span>
            </button>
        </form>

        <div id="loader" class="hidden mt-8 text-center space-y-4">
            <div class="flex justify-center space-x-2">
                <div class="w-3 h-3 bg-pink-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-3 h-3 bg-pink-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-3 h-3 bg-pink-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
            </div>
            <p class="text-pink-600 font-semibold animate-pulse text-sm">Analyzing Biometrics... This takes about 60s</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('analysisForm');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('submitBtn');

        form.onsubmit = function() {
            loader.classList.remove('hidden');
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.disabled = true;
        };
    </script>
</body>
</html>

<body class="bg-pink-50 flex flex-col items-center justify-center min-h-screen">
    <div class="text-center space-y-6">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-pink-500 border-opacity-50"></div>
        <h2 class="text-2xl font-bold text-pink-600">AI Analysis in Progress</h2>
        <p class="text-gray-500">Task ID: {{ task_id }}</p>
        <p class="animate-pulse text-pink-400">Current State: {{ state }}</p>
    </div>
    <script>
        // Poll every 3 seconds
        setTimeout(() => { window.location.reload(); }, 3000);
    </script>
</body>
